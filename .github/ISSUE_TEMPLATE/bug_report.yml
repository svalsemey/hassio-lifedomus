name: Bug report
description: Report a problem with the Lifedomus integration.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem. A diagnostics file lets us reproduce most issues without back-and-forth, so please attach one.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and found no report of this problem.
          required: true
        - label: I am running the latest release of the integration.
          required: true
        - label: I removed any remaining personal data (hostnames, labels, codes) from the attached files.
          required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.8.1"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: Shown in HACS or in `custom_components/lifedomus/manifest.json`.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: gateway_version
    attributes:
      label: Gateway firmware version
      description: Shown on the Lifedomus hub device page (firmware) or under `gateway.version` in the diagnostics file.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Setup / config flow
        - Reauthentication or reconfiguration
        - Binary sensor
        - Button
        - Climate
        - Cover
        - Light
        - Sensor
        - Switch
        - Push monitor (SSH tunnel)
        - Diagnostics
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics file
      description: |
        Settings → Devices & services → Lifedomus → ⋮ → **Download diagnostics** (or from the affected device page). Drag and drop the JSON file here. Secrets are redacted automatically.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: |
        Enable debug logging (⋮ menu of the entry → *Enable debug logging*), reproduce the problem, disable it to download the log, then paste the relevant lines.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Device models involved, network specifics, anything else useful.
