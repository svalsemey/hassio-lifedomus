rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no custom actions.
  appropriate-polling: done
  brands:
    status: todo
    comment: Submit the logo and icon to the custom_integrations folder of home-assistant/brands.
  common-modules: done
  config-flow-test-coverage: todo
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration registers no custom actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration exposes no options.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: todo
    comment: Discovered gateways could update the stored host of an existing entry when the IP changes.
  discovery:
    status: todo
    comment: The proprietary multicast probe only runs from the user step; publishing results as integration_discovery flows at startup remains to be done.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices:
    status: todo
    comment: Entities are created at setup only; devices added to the gateway afterwards require a reload.
  entity-category:
    status: todo
    comment: System variables and alarm warning states should be tagged DIAGNOSTIC.
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: todo
    comment: Icons are set from code; move them to icons.json with state-based icons.
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: No situation calls for a repair issue; authentication problems are handled by the reauth flow.
  stale-devices:
    status: done
    comment: Devices no longer reported by the gateway can be removed from the device page.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: Run mypy --strict on the integration and confirm asyncssh and defusedxml ship type information.
